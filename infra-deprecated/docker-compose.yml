services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      TZ: Asia/Kolkata
    networks:
      - autoresolve_net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      TZ: Asia/Kolkata
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autoresolve_net

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Kolkata
    networks:
      - autoresolve_net

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ../target_environments/qdrant_data:/qdrant/storage
    environment:
      TZ: Asia/Kolkata
    networks:
      - autoresolve_net

  api-gateway:
    build:
      context: ../
      dockerfile: Dockerfile
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ../:/app
      - /app/.venv
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - QDRANT_URL=http://qdrant:6333
      # Securely injecting secrets into the DSN string
      - POSTGRES_DSN=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AUTORESOLVE_API_KEY=${AUTORESOLVE_API_KEY}
      - API_KEY=${API_KEY}
      - TZ=Asia/Kolkata
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - autoresolve_net

  ai-worker:
    build:
      context: ../
      dockerfile: Dockerfile
    command: ["python", "-m", "src.agents.worker"]
    volumes:
      - ../:/app
      - /app/.venv
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - QDRANT_URL=http://qdrant:6333
      # Securely injecting secrets into the DSN string
      - POSTGRES_DSN=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_BACKEND=${LLM_BACKEND}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - TZ=Asia/Kolkata
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - autoresolve_net

networks:
  autoresolve_net:
    driver: bridge